[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "cocinap"
version = "1.0.1"
description = "Sistema de Seguridad en Cocina con deteccion inteligente de fuego, humo y cocina desatendida usando YOLO11 + OpenCV"
readme = "README.md"
license = {text = "Proprietary"}
requires-python = ">=3.10"
authors = [
    {name = "Kevin Villeros", email = "kevinvilleros77@gmail.com"},
]
keywords = ["kitchen", "safety", "fire-detection", "smoke-detection", "yolo", "opencv", "computer-vision"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: End Users/Desktop",
    "License :: Other/Proprietary License",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Image Recognition",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Home Automation",
]
dependencies = [
    "opencv-contrib-python>=4.10.0",
    "ultralytics>=8.3.0",
    "torch>=2.5.0",
    "numpy>=1.26.0",
    "PySide6>=6.7.0",
    "zeroconf>=0.131.0",
    "firebase-admin>=6.5.0",
    "qrcode[pil]>=7.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
]

[project.urls]
Homepage = "https://github.com/KevinVilleros/KitchenGuard"
Repository = "https://github.com/KevinVilleros/KitchenGuard"
Issues = "https://github.com/KevinVilleros/KitchenGuard/issues"
Changelog = "https://github.com/KevinVilleros/KitchenGuard/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
include = ["cocinap*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks integration tests requiring camera/model",
]

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["cocinap"]
