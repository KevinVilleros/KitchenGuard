name: cocinap_mobile
description: CocinaP mobile companion app
publish_to: 'none'
version: 1.0.10+10

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.0
  shared_preferences: ^2.3.0
  flutter_secure_storage: ^9.2.4
  flutter_local_notifications: ^22.3.3
  cupertino_icons: ^1.0.8
  flutter_background_service: ^5.0.0
  flutter_background_service_android: ^6.0.0
  flutter_background_service_ios: ^5.0.0
  camera: ^0.11.0
  google_mlkit_pose_detection: ^0.16.1
  path_provider: ^2.1.0
  image: ^4.2.0
  crypto: ^3.0.7
  xml: ^6.5.0
  media_kit: ^1.2.6
  media_kit_video: ^2.0.1
  media_kit_libs_video: ^1.0.7
  wakelock_plus: ^1.5.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
