name: Mobile Builds CocinaP

# Genera los artefactos móviles y publica instaladores utilizables cuando hay firma.
# - Android: APK debug firmado para instalación de prueba.
# - iOS: IPA ad-hoc firmado solo si se configuran certificado y perfil Apple.
# - IPA sin firmar: artefacto de compilación, no es una app instalable directamente.

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Optional tag to publish as a GitHub Release (for example, v1.0.7)
        required: false
        type: string
  push:
    branches: [main, master]
    tags: ['v*']
    paths:
      - 'cocinap_mobile/**'
      - '.github/workflows/ios.yml'

permissions:
  contents: write

jobs:
  validate-mobile:
    name: Analyze and test (Flutter)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cocinap_mobile
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Flutter pub get
        run: flutter pub get

      - name: Flutter analyze
        run: flutter analyze

      - name: Flutter tests
        run: flutter test

  build-unsigned:
    name: Build IPA (unsigned)
    runs-on: macos-latest
    needs: validate-mobile
    defaults:
      run:
        working-directory: cocinap_mobile
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Flutter pub get
        run: flutter pub get

      - name: Build iOS app (genera pods y compila)
        run: |
          set +e
          flutter build ios --release --no-codesign -v > /tmp/flutter_build.log 2> /tmp/flutter_build.err
          code=$?
          cat /tmp/flutter_build.log
          cat /tmp/flutter_build.err
          if [ $code -ne 0 ]; then
            grep -niE "error:|Error \(Xcode\)|The following build commands failed|No such module|Undefined symbol|requires a provisioning|sandbox is not in sync" /tmp/flutter_build.log /tmp/flutter_build.err | head -n 10 | while IFS= read -r line; do
              echo "::error::$line"
            done
            exit 1
          fi

      - name: Extra iOS diagnostics
        if: failure()
        run: |
          echo "=== bloque de fallo de xcodebuild ==="
          grep -n -A8 "The following build commands failed" /tmp/flutter_build.err /tmp/flutter_build.log 2>/dev/null | head -n 10 | while IFS= read -r line; do
            echo "::error::$line"
          done

      - name: Linker diagnostics
        if: failure()
        run: |
          grep -niE "ld: |clang: error|fatal error|module .* not found|Deployment Target|minimum deployment" /tmp/flutter_build.err /tmp/flutter_build.log 2>/dev/null | head -n 10 | while IFS= read -r line; do
            echo "::error::$line"
          done

      - name: Publicar logs en rama ci-logs
        if: failure()
        run: |
          cp /tmp/flutter_build.log ../flutter_build.log || true
          cp /tmp/flutter_build.err ../flutter_build.err || true
          cd ..
          git config user.email "ci@local"
          git config user.name "ci"
          git checkout -B ci-logs
          git add -f flutter_build.log flutter_build.err
          git commit -m "ci logs run ${{ github.run_id }}" || true
          git push -f origin ci-logs || true

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: flutter-build-log
          path: |
            /tmp/flutter_build.log
            /tmp/flutter_build.err
          if-no-files-found: ignore

      - name: Package unsigned IPA
        run: |
          mkdir -p Payload
          cp -r build/ios/iphoneos/*.app Payload/
          zip -r CocinaP-unsigned.ipa Payload

      - uses: actions/upload-artifact@v7
        with:
          name: CocinaP-iOS
          path: cocinap_mobile/CocinaP-unsigned.ipa
          if-no-files-found: error

  build-android:
    name: Build signed debug APK (Android)
    runs-on: ubuntu-latest
    needs: validate-mobile
    defaults:
      run:
        working-directory: cocinap_mobile
    steps:
      - uses: actions/checkout@v4

      - name: Configure Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Flutter pub get
        run: flutter pub get

      - name: Build installable Android debug APK
        run: flutter build apk --debug

      - uses: actions/upload-artifact@v7
        with:
          name: CocinaP-Android-debug
          path: cocinap_mobile/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error

  build-signed:
    name: Build IPA (signed)
    runs-on: macos-latest
    needs: build-unsigned
    defaults:
      run:
        working-directory: cocinap_mobile
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Comprobar certificado configurado
        run: |
          if [ -z "$IOS_CERTIFICATE" ] || [ -z "$IOS_CERTIFICATE_PASSWORD" ] || [ -z "$IOS_PROVISIONING_PROFILE" ]; then
            echo "::notice::Firma iOS no configurada. No se publicará un IPA instalable."
            exit 0
          fi
        env:
          IOS_CERTIFICATE: ${{ secrets.IOS_CERTIFICATE }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          IOS_PROVISIONING_PROFILE: ${{ secrets.IOS_PROVISIONING_PROFILE }}

      - name: Import signing certificate
        env:
          IOS_CERTIFICATE: ${{ secrets.IOS_CERTIFICATE }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          IOS_PROVISIONING_PROFILE: ${{ secrets.IOS_PROVISIONING_PROFILE }}
        run: |
          if [ -z "$IOS_CERTIFICATE" ] || [ -z "$IOS_CERTIFICATE_PASSWORD" ] || [ -z "$IOS_PROVISIONING_PROFILE" ]; then
            echo "Sin certificado. Omitiendo firma."
            exit 0
          fi
          echo "$IOS_CERTIFICATE" | base64 --decode > cert.p12
          echo "$IOS_PROVISIONING_PROFILE" | base64 --decode > profile.mobileprovision

          security create-keychain -p cocinap build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p cocinap build.keychain
          security import cert.p12 -k build.keychain -P "$IOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k cocinap build.keychain

          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp profile.mobileprovision "$HOME/Library/MobileDevice/Provisioning Profiles/"

      - name: Flutter pub get
        run: flutter pub get

      - name: Build signed IPA (genera pods y compila)
        run: |
          if [ ! -f cert.p12 ]; then
            echo "Sin certificado Apple y perfil de aprovisionamiento; no se puede crear un IPA instalable."
            exit 0
          fi
          flutter build ipa --release --export-method ad-hoc

      - name: Subir IPA firmado (si existe)
        if: ${{ hashFiles('cocinap_mobile/build/ios/ipa/*.ipa') != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: CocinaP-iOS-signed
          path: cocinap_mobile/build/ios/ipa/*.ipa
          if-no-files-found: error

  publish-release:
    name: Publish installable mobile builds
    runs-on: ubuntu-latest
    needs: [build-unsigned, build-android, build-signed]
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
    steps:
      - name: Download iOS IPA
        uses: actions/download-artifact@v4
        with:
          name: CocinaP-iOS
          path: artifacts/ios

      - name: Download Android APK
        uses: actions/download-artifact@v4
        with:
          name: CocinaP-Android-debug
          path: artifacts/android

      - name: Download signed iOS IPA if available
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: CocinaP-iOS-signed
          path: artifacts/ios-signed

      - name: Prepare release assets
        run: |
          cp artifacts/android/app-debug.apk CocinaP-Android-debug.apk
          if [ -d artifacts/ios-signed ]; then
            ipa="$(find artifacts/ios-signed -maxdepth 2 -type f -name '*.ipa' -print -quit)"
            if [ -n "$ipa" ]; then
              cp "$ipa" CocinaP-iOS-signed.ipa
            fi
          fi

      - name: Create release and attach installers
        uses: actions/github-script@v7
        env:
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        with:
          github-token: ${{ github.token }}
          script: |
            const fs = require('node:fs');
            const assets = [
              { path: 'CocinaP-Android-debug.apk', name: 'CocinaP-Android-debug.apk' },
            ];
            if (fs.existsSync('CocinaP-iOS-signed.ipa')) {
              assets.push({
                path: 'CocinaP-iOS-signed.ipa',
                name: 'CocinaP-iOS-signed.ipa',
              });
            }
            const releaseTag = process.env.RELEASE_TAG;
            const body = [
              'Android: debug-signed APK for direct testing. To install over a copy signed with a different key, uninstall the old app first; this erases its local data. This is not a Play Store production build.',
              fs.existsSync('CocinaP-iOS-signed.ipa')
                ? 'iOS: ad-hoc signed IPA. It installs only on devices included in the Apple provisioning profile.'
                : 'iOS: no IPA attached because Apple signing credentials and a provisioning profile are not configured. An unsigned IPA cannot be installed directly.',
            ].join('\n\n');
            let release;
            try {
              ({ data: release } = await github.rest.repos.createRelease({
                owner: context.repo.owner,
                repo: context.repo.repo,
                tag_name: releaseTag,
                name: `CocinaP ${releaseTag}`,
                body,
              }));
            } catch (error) {
              if (error.status !== 422) throw error;
              ({ data: release } = await github.rest.repos.getReleaseByTag({
                owner: context.repo.owner,
                repo: context.repo.repo,
                tag: releaseTag,
              }));
            }
            const existing = await github.paginate(
              github.rest.repos.listReleaseAssets,
              { owner: context.repo.owner, repo: context.repo.repo, release_id: release.id },
            );
            for (const asset of existing) {
              if ([
                'CocinaP-Android-unsigned.apk',
                'CocinaP-iOS-unsigned.ipa',
                'CocinaP-Android-debug.apk',
                'CocinaP-iOS-signed.ipa',
              ].includes(asset.name)) {
                await github.rest.repos.deleteReleaseAsset({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  asset_id: asset.id,
                });
              }
            }
            for (const asset of assets) {
              const size = fs.statSync(asset.path).size;
              await github.rest.repos.uploadReleaseAsset({
                owner: context.repo.owner,
                repo: context.repo.repo,
                release_id: release.id,
                name: asset.name,
                data: fs.createReadStream(asset.path),
                headers: {
                  'content-type': 'application/octet-stream',
                  'content-length': size,
                },
              });
            }
            if (releaseTag === 'v1.0.8') {
              const { data: previousRelease } = await github.rest.repos.getReleaseByTag({
                owner: context.repo.owner,
                repo: context.repo.repo,
                tag: 'v1.0.7',
              }).catch((error) => {
                if (error.status === 404) return { data: null };
                throw error;
              });
              if (previousRelease) {
                const previousAssets = await github.paginate(
                  github.rest.repos.listReleaseAssets,
                  {
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    release_id: previousRelease.id,
                  },
                );
                for (const asset of previousAssets) {
                  if ([
                    'CocinaP-Android-unsigned.apk',
                    'CocinaP-iOS-unsigned.ipa',
                  ].includes(asset.name)) {
                    await github.rest.repos.deleteReleaseAsset({
                      owner: context.repo.owner,
                      repo: context.repo.repo,
                      asset_id: asset.id,
                    });
                  }
                }
                await github.rest.repos.updateRelease({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  release_id: previousRelease.id,
                  body: 'The original unsigned files in this release are not directly installable. Use v1.0.8 for an Android test APK. iOS requires Apple signing and a provisioning profile.',
                });
              }
            }
            core.info(`Published release ${releaseTag}: ${release.html_url}`);
